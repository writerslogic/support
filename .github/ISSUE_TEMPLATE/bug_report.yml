name: Bug report
description: Report something that isn't working in WritersProof
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: WritersProof version, description: "Settings → About" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: What you did, what you expected, what happened }
    validations: { required: true }
